{% extends 'study/base.html' %}
{% block content %}
<h1>{% if is_new %}新規カード追加{% else %}カード編集{% endif %}</h1>
<div class="panel">
<form method="post">{% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div style="color:#c62828">{{ field.errors }}</div>{% endif %}
  </div>
  {% endfor %}
  <div class="actions">
    <button type="submit">保存</button>
    <a href="{% url 'study:card_list' %}"><button type="button">キャンセル</button></a>
  </div>
</form>
</div>
{% endblock %}
