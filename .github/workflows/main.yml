name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_DIR }}
            git checkout .
            git pull --ff-only origin main

            # DEPLOY_PYTHONには、Apacheが使用する仮想環境のpython絶対パスを設定できます。
            PYTHON_BIN="${{ secrets.DEPLOY_PYTHON }}"
            if [ -z "$PYTHON_BIN" ]; then
              for candidate in projects/synapse/bin/python synapse/bin/python /opt/bitnami/synapseai/bin/python /opt/bitnami/synapseai/venv/bin/python /opt/bitnami/python/bin/python3 /opt/bitnami/python/bin/python python3; do
                if command -v "$candidate" >/dev/null 2>&1 && "$candidate" -c "import django" >/dev/null 2>&1; then
                  PYTHON_BIN="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$PYTHON_BIN" ]; then
              echo "Djangoを利用できるPythonが見つかりません。DEPLOY_PYTHON secretを設定してください。"
              exit 1
            fi

            echo "Using Python: $PYTHON_BIN"
            "$PYTHON_BIN" projects/manage.py migrate --noinput
            "$PYTHON_BIN" projects/manage.py seed_cards
            "$PYTHON_BIN" projects/manage.py shell -c "from study.management.commands.seed_cards import CARDS; from study.models import Card; expected={card[0] for card in CARDS}; actual=set(Card.objects.filter(front__in=expected).values_list('front', flat=True)); missing=expected-actual; assert not missing, f'カードが不足しています: {len(missing)}件'; print(f'カード確認: {len(actual)}/{len(expected)}件')"

            sudo /opt/bitnami/ctlscript.sh restart apache
